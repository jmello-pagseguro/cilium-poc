apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: app-1-github-only-l7-terminate
  namespace: cilium-poc
spec:
  endpointSelector:
    matchLabels:
      app: app-1
  egress:
  - toEndpoints:
    - matchLabels:
        k8s:io.kubernetes.pod.namespace: kube-system
        k8s:k8s-app: kube-dns
    toPorts:
    - ports:
      - port: "53"
        protocol: ANY
  - toPorts:
    - ports:
      - port: "443"
        protocol: TCP
      terminatingTLS:
        secret:
          name: github-egress-tls
      rules:
        http:
        - host: "api.github.com"
          method: "GET"
